name: ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL to scan (passive baseline scan only)"
        required: true
        default: "https://cardmaker.pixelsmith.io"

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target }}
          # -a: include alpha passive rules, -j: AJAX spider so client-rendered routes are crawled
          cmd_options: "-a -j"
          issue_title: "ZAP Baseline Report"
          fail_action: false
          artifact_name: zap-baseline-report
